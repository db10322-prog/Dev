<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>처음 실행 설정</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Malgun Gothic", sans-serif; background: #f7f8fa; color: #1c1f26;
  }
  .card { width: 360px; padding: 32px; text-align: center; }
  .icon { width: 64px; height: 64px; margin: 0 auto 20px; }
  h1 { font-size: 17px; margin: 0 0 8px; }
  p { font-size: 13px; color: #6b7280; margin: 0 0 24px; line-height: 1.6; }
  .bar-track { background: #eef0f2; border-radius: 999px; height: 10px; overflow: hidden; }
  .bar-fill { background: #3182f6; height: 100%; width: 0%; transition: width .2s; border-radius: 999px; }
  .pct { margin-top: 10px; font-size: 12px; color: #8b95a1; font-variant-numeric: tabular-nums; }
  .error { color: #c0392b; font-size: 12.5px; margin-top: 14px; display: none; }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#f6ecd9" stroke="#20232b" stroke-width="3"/>
      <path d="M46 20 q5 -13 14 -11" fill="none" stroke="#20232b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="61" cy="9" r="4" fill="#e2572c"/>
      <circle cx="38" cy="48" r="3.6" fill="#20232b"/>
      <circle cx="63" cy="49" r="2.4" fill="#20232b"/>
      <circle cx="31" cy="60" r="4.5" fill="#e2572c" opacity=".32"/>
      <circle cx="67" cy="61" r="4.5" fill="#e2572c" opacity=".32"/>
    </svg>
    <h1>처음 실행 준비 중</h1>
    <p>AI 판정 모델을 내려받고 있습니다.<br/>계정이나 로그인 없이 한 번만 받으면 됩니다 (약 1.9GB).</p>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <div class="pct" id="pct">연결 중...</div>
    <div class="error" id="error"></div>
  </div>
  <script src="setup.js"></script>
</body>
</html>
